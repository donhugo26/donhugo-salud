<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#167c80">
    <title>DonHugo Salud</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f7;
            color: #1f2937;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
        }

        header {
            background: #167c80;
            color: white;
            padding: 28px 22px 24px;
            border-radius: 0 0 24px 24px;
        }

        header small {
            opacity: 0.85;
        }

        header h1 {
            margin: 8px 0 4px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            opacity: 0.9;
        }

        main {
            padding: 22px;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome h2 {
            margin: 0 0 5px;
            font-size: 22px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
        }

        .register {
            width: 100%;
            border: none;
            background: #167c80;
            color: white;
            padding: 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 24px;
        }

        .register:active {
            transform: scale(0.98);
        }

        .card {
            background: #f4f7f7;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .glucose {
            font-size: 38px;
            font-weight: bold;
            color: #167c80;
        }

        .unit {
            font-size: 16px;
            color: #6b7280;
        }

        .date {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .section-title {
            font-size: 20px;
            margin: 28px 0 14px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu-item {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            font-weight: bold;
        }

        .menu-item span {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <small>Control personal de salud</small>
        <h1>DonHugo Salud</h1>
        <p>Control de glucosa</p>
    </header>

    <main>

        <div class="welcome">
            <h2>Hola 👋</h2>
            <p>Registrá tus mediciones y llevá el control de tu glucosa.</p>
        </div>

        <button class="register">
            ＋ Registrar glucosa
        </button>

        <div class="card">
            <div class="card-title">Última medición</div>

            <div>
                <span class="glucose">108</span>
                <span class="unit">mg/dL</span>
            </div>

            <div class="date">
                Hoy · 08:05 · Ayunas
            </div>
        </div>

        <h2 class="section-title">Mi seguimiento</h2>

        <div class="menu">

            <div class="menu-item">
                <span>📊</span>
                Evolución
            </div>

            <div class="menu-item">
                <span>📋</span>
                Historial
            </div>

            <div class="menu-item">
                <span>📄</span>
                Informes
            </div>

            <div class="menu-item">
                <span>⚙️</span>
                Mi perfil
            </div>

        </div>

    </main>

    <footer>
        DonHugo Salud · Control y seguimiento
    </footer>

</div>

</body>
</html>
